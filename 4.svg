<svg width="1800" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 32px; font-weight: bold; fill: #2c3e50; }
      .layer-title { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #ffffff; }
      .text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #2c3e50; }
      .label { font-family: 'Arial', sans-serif; font-size: 12px; fill: #e74c3c; font-weight: bold; }
      .step { font-family: 'Arial', sans-serif; font-size: 16px; fill: #ffffff; font-weight: bold; }
      
      .box-frontend { fill: #3498db; stroke: #2980b9; stroke-width: 3; }
      .box-backend { fill: #e74c3c; stroke: #c0392b; stroke-width: 3; }
      .box-ai { fill: #9b59b6; stroke: #8e44ad; stroke-width: 3; }
      .box-database { fill: #27ae60; stroke: #229954; stroke-width: 3; }
      
      .arrow-step { stroke: #34495e; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .arrow-data { stroke: #e74c3c; stroke-width: 2; fill: none; stroke-dasharray: 5,5; marker-end: url(#arrow-red); }
    </style>
    
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#34495e" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e74c3c" />
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="1800" height="800" fill="#ecf0f1"/>
  
  <!-- 標題 -->
  <text x="900" y="50" class="title" text-anchor="middle">YOLO1125 系統數據流動圖</text>
  
  <!-- 前端 -->
  <rect x="50" y="150" width="300" height="500" rx="10" class="box-frontend"/>
  <text x="200" y="190" class="layer-title" text-anchor="middle">前端 (Frontend)</text>
  
  <rect x="65" y="210" width="250" height="280" rx="5" fill="#ffffff"/>
  <text x="70" y="230" class="text" fill="#fff">📷 攝影機擷取影像</text>
  <text x="70" y="270" class="text" fill="#fff">🎨 Canvas 顯示畫面</text>
  <text x="70" y="310" class="text" fill="#fff">🔌 WebSocket 連線</text>
  <text x="70" y="350" class="text" fill="#fff">🛒 購物車 UI</text>
  <text x="70" y="390" class="text" fill="#fff">💬 AI 對話界面</text>
  <text x="70" y="430" class="text" fill="#fff">👤 使用者資訊面板</text>
  <text x="70" y="470" class="text" fill="#fff">🔘 結帳按鈕</text>
  
  
  <!-- 後端 -->
  <rect x="450" y="150" width="550" height="500" rx="10" class="box-backend"/>
  <text x="725" y="190" class="layer-title" text-anchor="middle">後端 (Backend Services)</text>
  
  <!-- 後端服務列表 -->
  <rect x="480" y="220" width="220" height="80" rx="5" fill="#ffffff"/>
  <text x="590" y="245" class="text" text-anchor="middle" font-weight="bold">🔌 WebSocket Server</text>
  <text x="490" y="270" class="text">• 接收影像</text>
  <text x="490" y="290" class="text">• 訊息路由</text>
  
  <rect x="730" y="220" width="220" height="80" rx="5" fill="#ffffff"/>
  <text x="840" y="245" class="text" text-anchor="middle" font-weight="bold">🎯 YOLO Service</text>
  <text x="740" y="270" class="text">• 商品辨識</text>
  <text x="740" y="290" class="text">• 準確率 ≥ 95%</text>
  
  <rect x="480" y="330" width="220" height="80" rx="5" fill="#ffffff"/>
  <text x="590" y="355" class="text" text-anchor="middle" font-weight="bold">👤 Face Service</text>
  <text x="490" y="380" class="text">• 人臉偵測</text>
  <text x="490" y="400" class="text">• 人臉比對</text>
  
  <rect x="730" y="330" width="220" height="80" rx="5" fill="#ffffff"/>
  <text x="840" y="355" class="text" text-anchor="middle" font-weight="bold">🛒 Cart Service</text>
  <text x="740" y="380" class="text">• 購物車管理</text>
  <text x="740" y="400" class="text">• 數量累加</text>
  
  <rect x="480" y="440" width="220" height="80" rx="5" fill="#ffffff"/>
  <text x="590" y="465" class="text" text-anchor="middle" font-weight="bold">🌐 HTTP API</text>
  <text x="490" y="490" class="text">• 註冊、結帳</text>
  <text x="490" y="510" class="text">• 交易查詢</text>
  
  <rect x="730" y="440" width="220" height="80" rx="5" fill="#ffffff"/>
  <text x="840" y="465" class="text" text-anchor="middle" font-weight="bold">👨‍💼 Admin API</text>
  <text x="740" y="490" class="text">• 商品管理</text>
  <text x="740" y="510" class="text">• 活動設定</text>
  
  <rect x="480" y="550" width="470" height="80" rx="5" fill="#ffffff"/>
  <text x="715" y="580" class="text" text-anchor="middle" font-weight="bold">🤖 Ollama LLM (AI 層)</text>
  <text x="490" y="605" class="text" fill="#fff">• 讀取促銷活動</text>
  <text x="490" y="620" class="text" fill="#fff">• 生成回應</text>
  <text x="740" y="605" class="text" fill="#fff">• 讀取客服資訊</text>
  <text x="740" y="620" class="text" fill="#fff">• 即時同步後台</text>
  
  <!-- 資料庫 -->
  <rect x="1100" y="150" width="650" height="500" rx="10" class="box-database"/>
  <text x="1425" y="190" class="layer-title" text-anchor="middle">資料庫 (MongoDB)</text>
  
  <rect x="1130" y="220" width="280" height="100" rx="5" fill="#ffffff"/>
  <text x="1270" y="245" class="text" text-anchor="middle" font-weight="bold">👥 Users</text>
  <text x="1140" y="270" class="text">• 姓名、電話</text>
  <text x="1140" y="290" class="text">• 人臉特徵</text>
  <text x="1140" y="310" class="text">• 註冊日期</text>
  
  <rect x="1440" y="220" width="280" height="100" rx="5" fill="#ffffff"/>
  <text x="1580" y="245" class="text" text-anchor="middle" font-weight="bold">📦 Products</text>
  <text x="1450" y="270" class="text">• 商品名稱</text>
  <text x="1450" y="290" class="text">• 商品價格</text>
  
  <rect x="1130" y="350" width="280" height="100" rx="5" fill="#ffffff"/>
  <text x="1270" y="375" class="text" text-anchor="middle" font-weight="bold">💰 Transactions</text>
  <text x="1140" y="400" class="text">• 使用者 ID</text>
  <text x="1140" y="420" class="text">• 商品明細</text>
  <text x="1140" y="440" class="text">• 總金額、時間</text>
  
  <rect x="1440" y="350" width="280" height="100" rx="5" fill="#ffffff"/>
  <text x="1580" y="375" class="text" text-anchor="middle" font-weight="bold">🎉 Promotions</text>
  <text x="1450" y="400" class="text">• 活動名稱</text>
  <text x="1450" y="420" class="text">• 折扣規則</text>
  <text x="1450" y="440" class="text">• 啟用狀態</text>
  
  <rect x="1130" y="480" width="590" height="100" rx="5" fill="#ffffff"/>
  <text x="1425" y="505" class="text" text-anchor="middle" font-weight="bold">📁 檔案系統 (data/faces/)</text>
  <text x="1140" y="530" class="text">• 使用者人臉特徵</text>
  <text x="1140" y="550" class="text">• 用於特徵比對與顯示</text>
  
  <!-- 數據流動箭頭 -->
  <!-- 1. 前端 → 後端 -->
  <path d="M 350 300 L 450 300" class="arrow-step"/>
  <circle cx="400" cy="280" r="20" fill="#f39c12"/>
  <text x="400" y="287" class="step" text-anchor="middle">1</text>
  <text x="400" y="265" class="label" text-anchor="middle">影像</text>
  
  <!-- 2. 後端 → 資料庫 -->
  <path d="M 1000 350 L 1100 350" class="arrow-step"/>
  <circle cx="1050" cy="330" r="20" fill="#f39c12"/>
  <text x="1050" y="337" class="step" text-anchor="middle">2</text>
  <text x="1050" y="315" class="label" text-anchor="middle">查詢資料</text>
  
  <!-- 3. 資料庫 → 後端 -->
  <path d="M 1100 400 L 1000 400" class="arrow-step"/>
  <circle cx="1050" cy="420" r="20" fill="#f39c12"/>
  <text x="1050" y="427" class="step" text-anchor="middle">3</text>
  <text x="1050" y="445" class="label" text-anchor="middle">回傳資料</text>
  
  <!-- 4. 後端 → 前端 -->
  <path d="M 450 450 L 350 450" class="arrow-step"/>
  <circle cx="400" cy="470" r="20" fill="#f39c12"/>
  <text x="400" y="477" class="step" text-anchor="middle">4</text>
  <text x="400" y="495" class="label" text-anchor="middle">辨識結果</text>
  
  <!-- AI 查詢路徑 -->
  <path d="M 950 590 L 1100 520" class="arrow-data"/>
  <text x="1020" y="550" class="label">AI 讀取促銷活動</text>
  
  <!-- 底部流程說明 -->
  <rect x="50" y="700" width="1700" height="80" rx="5" fill="#34495e"/>
  <text x="900" y="730" class="layer-title" text-anchor="middle">完整數據流程</text>
  <text x="900" y="760" class="t" fill="#ffffff" text-anchor="middle">前端擷取影像 → WebSocket 傳送 → 後端辨識 (YOLO/Face) → 查詢 MongoDB → 回傳結果 → 更新前端 UI → AI 查詢促銷資訊</text>
</svg>